name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (Windows MSVC + Python)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake -B build -S engine -DCMAKE_BUILD_TYPE=Release

      - name: Compile Phonoryx Engine DLL and C++ Tests
        run: cmake --build build --config Release

      - name: Run Native Engine C++ Test Suite
        run: .\build\bin\Release\phonoryx_tests.exe

      - name: Copy Built DLL to assets/bin/
        run: |
          New-Item -ItemType Directory -Force -Path assets/bin
          Copy-Item build/bin/Release/phonoryx_engine.dll assets/bin/phonoryx_engine.dll -Force

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Python Integration Tests
        run: python -m pytest tests -v
