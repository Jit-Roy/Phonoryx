<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" role="img" aria-label="Phonoryx">
  <title>Phonoryx</title>
  <defs>
    <linearGradient id="phonoBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb020"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="pillBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1f27"/>
      <stop offset="100%" stop-color="#0d1016"/>
    </linearGradient>
    <linearGradient id="pillStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb020" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#f4f6fa" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="256" height="60" rx="14" fill="url(#pillBg)" stroke="url(#pillStroke)" stroke-width="1.5"/>

  <text x="130" y="45"
        text-anchor="middle"
        font-family="Segoe UI, Liberation Sans, Arial, Helvetica, sans-serif"
        font-size="38"
        font-weight="800"
        letter-spacing="1"><tspan fill="url(#phonoBrand)">Phono</tspan><tspan fill="#f4f6fa">ryx</tspan></text>
</svg>

